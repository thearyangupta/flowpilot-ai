worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # --------------------------------------------
        # API health endpoints
        # --------------------------------------------

        location = /api/health {
            proxy_pass https://flowpilot-api-932960433777.asia-south1.run.app/health;

            proxy_ssl_server_name on;
            proxy_ssl_name flowpilot-api-932960433777.asia-south1.run.app;

            proxy_set_header Host flowpilot-api-932960433777.asia-south1.run.app;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/ready {
            proxy_pass https://flowpilot-api-932960433777.asia-south1.run.app/ready;

            proxy_ssl_server_name on;
            proxy_ssl_name flowpilot-api-932960433777.asia-south1.run.app;

            proxy_set_header Host flowpilot-api-932960433777.asia-south1.run.app;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------
        # FlowPilot application API
        # Preserve /api/v1/... exactly.
        # --------------------------------------------

        location /api/ {
            proxy_pass https://flowpilot-api-932960433777.asia-south1.run.app;

            proxy_ssl_server_name on;
            proxy_ssl_name flowpilot-api-932960433777.asia-south1.run.app;

            proxy_http_version 1.1;

            proxy_set_header Host flowpilot-api-932960433777.asia-south1.run.app;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
        }

        # --------------------------------------------
        # Streamlit UI + websocket
        # --------------------------------------------

        location / {
            proxy_pass https://flowpilot-ui-932960433777.asia-south1.run.app;

            proxy_ssl_server_name on;
            proxy_ssl_name flowpilot-ui-932960433777.asia-south1.run.app;

            proxy_http_version 1.1;

            proxy_set_header Host flowpilot-ui-932960433777.asia-south1.run.app;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
